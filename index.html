<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elysium</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <div class="brand">Elysium</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="settings.html">Settings</a>
        <a href="help.html">Help</a>
        <a href="contact.html">Contact</a>
        <a href="admin.html">Admin</a>
      </nav>
      <div class="nav-actions">
        <select id="langSelect">
          <option value="en">EN</option>
          <option value="fr">FR</option>
        </select>
        <button id="themeToggleBtn" class="secondary-btn">Dark</button>
        <button id="authBtn" class="primary-btn">Login</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="eyebrow" data-i18n="hero.eyebrow">Student Library</p>
        <h1 data-i18n="hero.title">Share your course files with everyone</h1>
        <p data-i18n="hero.subtitle">
          Upload and discover ebooks, PDFs, images, and podcasts from your courses.
        </p>
        <div class="hero-actions">
          <button class="primary-btn" data-i18n="hero.uploadBtn" id="openUploadBtn">Upload a file</button>
          <a href="#resources" class="secondary-btn" data-i18n="hero.browseBtn">Browse resources</a>
        </div>
      </div>
    </section>

    <section class="panel search-panel">
      <input id="searchInput" type="text" placeholder="Search course, title, category" />
      <select id="typeFilter">
        <option value="all">All types</option>
        <option value="pdf">PDF</option>
        <option value="ebook">Ebook</option>
        <option value="image">Image</option>
        <option value="podcast">Podcast</option>
      </select>
      <button id="searchBtn" class="primary-btn">Search</button>
    </section>

    <section id="resources" class="resources">
      <div class="section-head">
        <h2 data-i18n="resources.title">Latest Resources</h2>
      </div>
      <div id="resourceGrid" class="resource-grid"></div>
    </section>
  </main>

  <div id="uploadModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" id="closeUploadModal">&times;</span>
      <h3 data-i18n="upload.title">Upload resource</h3>

      <form id="uploadForm">
        <input type="text" id="uploadTitle" placeholder="Title" required />
        <input type="text" id="uploadCourse" placeholder="Course" required />
        <select id="uploadType">
          <option value="pdf">PDF</option>
          <option value="ebook">Ebook</option>
          <option value="image">Image</option>
          <option value="podcast">Podcast</option>
        </select>
        <input type="text" id="uploadTags" placeholder="Tags (comma separated)" />
        <textarea id="uploadDescription" placeholder="Description"></textarea>
        <input type="file" id="fileInput" required />
        <button type="submit" class="primary-btn">Upload</button>
      </form>
    </div>
  </div>

  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" id="closeAuthModal">&times;</span>
      <h3 id="authTitle">Login</h3>
      <form id="authForm">
        <input type="email" id="emailInput" placeholder="Email" required />
        <input type="password" id="passwordInput" placeholder="Password" required />
        <button type="submit" class="primary-btn" id="authSubmitBtn">Login</button>
      </form>
      <p class="auth-switch">
        <span id="authModeText">Need an account?</span>
        <button type="button" id="toggleAuthMode" class="link-btn">Create one</button>
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
  </html>
