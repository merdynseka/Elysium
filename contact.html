<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elysium - Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <div class="brand">Elysium</div>
      <nav>
        <a href="index.html" data-i18n="nav.home">Accueil</a>
        <a href="settings.html" data-i18n="nav.settings">Paramètres</a>
        <a href="help.html" data-i18n="nav.help">Aide</a>
        <a href="contact.html" class="active" data-i18n="nav.contact">Contact</a>
        <a href="admin.html" data-i18n="nav.admin">Admin</a>
      </nav>
      <div class="nav-actions">
        <select id="langSelect">
          <option value="fr">FR</option>
          <option value="en">EN</option>
        </select>
        <div id="userProfile" class="user-profile hidden">
          <button id="profileMenuBtn" class="profile-chip-btn" type="button">
            <span id="userAvatar" class="user-avatar">?</span>
            <span id="userEmailLabel" class="user-email"></span>
            <span class="profile-caret"></span>
          </button>
          <div id="profileDropdown" class="profile-dropdown hidden">
            <div id="profileDropdownEmail" class="profile-dropdown-email"></div>
            <a href="settings.html" data-i18n="nav.settings">Paramètres</a>
            <button id="profileLogoutBtn" type="button" data-i18n="settings.logout">Se déconnecter</button>
          </div>
        </div>
        <button id="authBtn" class="primary-btn" data-i18n="auth.login">Connexion</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <h1 data-i18n="contact.title">Contact</h1>

    <section class="card">
      <form id="contactForm">
        <input type="text" id="contactName" data-i18n-placeholder="contact.namePh" placeholder="Votre nom" required />
        <input type="email" id="contactEmail" data-i18n-placeholder="contact.emailPh" placeholder="Votre e-mail" required />
        <textarea id="contactMessage" data-i18n-placeholder="contact.messagePh" placeholder="Votre message" required></textarea>
        <button type="submit" class="primary-btn" data-i18n="contact.send">Envoyer</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <span><strong>Elysium</strong> — Bibliothèque étudiante</span>
      <span data-i18n="footer.text">Partagez des ebooks, des PDFs, des images et des podcasts avec vos camarades.</span>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
