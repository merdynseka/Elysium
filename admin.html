<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elysium - Administration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <div class="brand">Elysium</div>
      <nav>
        <a href="index.html" data-i18n="nav.home">Accueil</a>
        <a href="settings.html" data-i18n="nav.settings">Paramètres</a>
        <a href="help.html" data-i18n="nav.help">Aide</a>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
        <a href="admin.html" class="active" data-i18n="nav.admin">Admin</a>
      </nav>
      <div class="nav-actions">
        <select id="langSelect">
          <option value="fr">FR</option>
          <option value="en">EN</option>
        </select>
        <button id="authBtn" class="primary-btn" data-i18n="auth.login">Connexion</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <h1 data-i18n="admin.title">Panneau d’administration</h1>

    <div id="adminAccessDenied" class="card hidden">
      <p data-i18n="admin.accessDenied">Authentification requise.</p>
    </div>

    <div id="adminPanel" class="hidden">
      <section class="card">
        <h3 data-i18n="admin.manageAdmins">Gérer les administrateurs</h3>
        <input type="email" id="adminEmailInput" data-i18n-placeholder="admin.emailPh" placeholder="E-mail du nouvel administrateur" />
        <button id="addAdminBtn" class="primary-btn" data-i18n="admin.addBtn">Ajouter</button>
      </section>

      <section class="card">
        <h3 data-i18n="admin.filesTitle">Fichiers téléversés</h3>
        <div id="adminFilesList"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <span><strong>Elysium</strong> — Bibliothèque étudiante</span>
      <span data-i18n="footer.text">Partagez des ebooks, des PDFs, des images et des podcasts avec vos camarades.</span>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
